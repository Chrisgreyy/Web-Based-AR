<!DOCTYPE html>
<html>
  <head>
    <title>Responsive AR Environmental Reveal</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      a-text {
        font-family: "Georgia, serif";
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <a-marker preset="hiro">
        <a-entity id="environmental-bars" scale="0.1 0.1 0.1">
          <a-text id="info-box" value="Loading Environmental Data..." color="black" align="center" position="0 7.5 0" scale="2 2 2"></a-text>

          <a-box id="env-bar" color="#4caf50" position="0 0.5 0" height="1" width="1" depth="1"></a-box>
          <a-text id="env-label" value="Initializing..." align="center" position="0 2 0" scale="2 2 2" color="#000"></a-text>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const entity = document.querySelector('#environmental-bars');
        const bar = document.querySelector('#env-bar');
        const label = document.querySelector('#env-label');
        const infoBox = document.querySelector('#info-box');

        const dataSeries = [
          { label: "Air Quality: Good", height: 1, color: "#4caf50", info: "The air is clean and healthy today." },
          { label: "Air Quality: Poor", height: 3, color: "#f44336", info: "High pollution levels detected. Limit outdoor activity." },
          { label: "CO2: Low", height: 1.2, color: "#03a9f4", info: "Carbon dioxide levels are within safe range." },
          { label: "CO2: High", height: 3.5, color: "#e91e63", info: "High CO2 levels detected. Ensure proper ventilation." },
          { label: "Noise: Low", height: 0.8, color: "#9c27b0", info: "Quiet environment. No noise pollution." },
          { label: "Noise: High", height: 2.8, color: "#ff5722", info: "High noise levels detected. Consider noise reduction." },
          { label: "Temperature: 15°C", height: 1.5, color: "#2196f3", info: "Cool and comfortable weather." },
          { label: "Temperature: 30°C", height: 2.5, color: "#ff9800", info: "Hot weather. Stay hydrated." },
          { label: "Humidity: 45%", height: 1.3, color: "#00bcd4", info: "Comfortable humidity level." },
          { label: "Humidity: 85%", height: 2.9, color: "#009688", info: "Very humid conditions. May feel sticky." },
          { label: "UV Index: Low", height: 0.7, color: "#8bc34a", info: "Low UV exposure risk." },
          { label: "UV Index: High", height: 3.2, color: "#ffc107", info: "High UV index. Wear sunscreen!" },
          { label: "Wind: Calm", height: 1, color: "#cddc39", info: "Light breeze. Ideal conditions." }
        ];

        let index = 0;

        function animateBar(data) {
          bar.removeAttribute('animation__height');
          bar.removeAttribute('animation__position');

          bar.setAttribute('color', data.color);

          bar.setAttribute('animation__height', {
            property: 'height',
            from: bar.getAttribute('height'),
            to: data.height,
            dur: 1000,
            easing: 'easeInOutQuad'
          });

          bar.setAttribute('animation__position', {
            property: 'position',
            from: bar.getAttribute('position'),
            to: `0 ${data.height / 2} 0`,
            dur: 1000,
            easing: 'easeInOutQuad'
          });

          label.setAttribute('value', data.label);
          label.setAttribute('position', `0 ${data.height + 0.5} 0`);
        }

        function showNextData() {
          if (index >= dataSeries.length) {
            bar.parentNode.removeChild(bar);
            label.parentNode.removeChild(label);
            revealAllBars();
            return;
          }

          const data = dataSeries[index];
          animateBar(data);
          index++;
          setTimeout(showNextData, 2500);
        }

        function revealAllBars() {
          infoBox.setAttribute('value', "Complete Environmental Data. Click bar for more details.");

          const spacing = 1.1;
          const totalWidth = (dataSeries.length - 1) * spacing;
          const startX = -totalWidth / 2;

          dataSeries.forEach((data, i) => {
            const x = startX + i * spacing;

            const newBar = document.createElement('a-box');
            newBar.setAttribute('color', data.color);
            newBar.setAttribute('height', data.height);
            newBar.setAttribute('width', 0.8);
            newBar.setAttribute('depth', 0.8);
            newBar.setAttribute('position', `${x} ${data.height / 2} 0`);
            newBar.setAttribute('scale', '0 0 0');
            newBar.setAttribute('class', 'clickable');
            newBar.setAttribute('animation__pop', {
              property: 'scale',
              to: '1 1 1',
              dur: 800,
              easing: 'easeOutBack',
              delay: i * 100
            });

           
            newBar.addEventListener('click', () => {
              infoBox.setAttribute('value', data.info);
            });

            const newLabel = document.createElement('a-text');
            newLabel.setAttribute('value', data.label);
            newLabel.setAttribute('align', 'center');
            newLabel.setAttribute('scale', '1 1 1');
            newLabel.setAttribute('color', '#111');
            newLabel.setAttribute('position', `${x} ${data.height + 0.6} 0`);

            entity.appendChild(newBar);
            entity.appendChild(newLabel);
          });
        }

      
        infoBox.setAttribute('value', "Loading Environmental Data...");
        showNextData();
      });
    </script>
  </body>
</html>
